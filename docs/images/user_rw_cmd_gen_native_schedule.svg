<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1020" viewBox="0 0 1180 1020">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .head { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #334155; }
      .node { font: 700 15px Consolas, "Microsoft YaHei", monospace; fill: #0f172a; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .arb { fill: #e7f0ff; stroke: #2563eb; stroke-width: 2; }
      .gate { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 4; }
      .write { fill: #fff1e6; stroke: #f97316; stroke-width: 2; }
      .read { fill: #e8f8ef; stroke: #16a34a; stroke-width: 2; }
      .preempt { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    </style>
  </defs>

  <text x="590" y="36" text-anchor="middle" class="title">Native user_rw_cmd_gen 调度状态图</text>
  <text x="180" y="82" text-anchor="middle" class="head">写事务</text>
  <text x="590" y="82" text-anchor="middle" class="head">仲裁主干：自上而下为优先级</text>
  <text x="1000" y="82" text-anchor="middle" class="head">读事务</text>

  <!-- arbitration spine -->
  <rect x="500" y="110" width="180" height="46" rx="8" class="arb"/>
  <text x="590" y="139" text-anchor="middle" class="node">RW_IDLE</text>

  <polygon points="590,182 710,222 590,262 470,222" class="gate"/>
  <text x="590" y="216" text-anchor="middle" class="small">1. calib / reset</text>
  <text x="590" y="234" text-anchor="middle" class="small">blocked?</text>

  <polygon points="590,292 710,332 590,372 470,332" class="gate"/>
  <text x="590" y="326" text-anchor="middle" class="small">2. replay</text>
  <text x="590" y="344" text-anchor="middle" class="small">blocked?</text>

  <rect x="500" y="402" width="180" height="46" rx="8" class="arb"/>
  <text x="590" y="431" text-anchor="middle" class="node">RW_ARB</text>

  <polygon points="590,476 710,516 590,556 470,516" class="gate"/>
  <text x="590" y="510" text-anchor="middle" class="small">3. wr urgent?</text>
  <text x="590" y="528" text-anchor="middle" class="small">GRANT_WRITE</text>

  <polygon points="590,586 710,626 590,666 470,626" class="gate"/>
  <text x="590" y="620" text-anchor="middle" class="small">4. rd urgent?</text>
  <text x="590" y="638" text-anchor="middle" class="small">GRANT_READ</text>

  <polygon points="590,696 710,736 590,776 470,736" class="gate"/>
  <text x="590" y="730" text-anchor="middle" class="small">5. rd aged?</text>
  <text x="590" y="748" text-anchor="middle" class="small">GRANT_READ</text>

  <polygon points="590,806 710,846 590,886 470,846" class="gate"/>
  <text x="590" y="840" text-anchor="middle" class="small">6. wr valid?</text>
  <text x="590" y="858" text-anchor="middle" class="small">GRANT_WRITE</text>

  <polygon points="590,906 710,946 590,986 470,946" class="gate"/>
  <text x="590" y="940" text-anchor="middle" class="small">7. rd valid?</text>
  <text x="590" y="958" text-anchor="middle" class="small">GRANT_READ</text>

  <!-- write column -->
  <rect x="80" y="610" width="200" height="46" rx="8" class="write"/>
  <text x="180" y="639" text-anchor="middle" class="node">RW_WRITE_REQ</text>

  <!-- read column -->
  <rect x="900" y="570" width="200" height="46" rx="8" class="read"/>
  <text x="1000" y="599" text-anchor="middle" class="node">RW_READ_CMD</text>
  <polygon points="1000,650 1120,690 1000,730 880,690" class="preempt"/>
  <text x="1000" y="684" text-anchor="middle" class="small">wr urgent</text>
  <text x="1000" y="702" text-anchor="middle" class="small">before app_rdy?</text>
  <rect x="900" y="765" width="200" height="46" rx="8" class="read"/>
  <text x="1000" y="794" text-anchor="middle" class="node">RW_READ_DATA</text>
  <polygon points="1000,840 1120,880 1000,920 880,880" class="preempt"/>
  <text x="1000" y="874" text-anchor="middle" class="small">done or</text>
  <text x="1000" y="892" text-anchor="middle" class="small">wr urgent?</text>

  <!-- spine arrows -->
  <path d="M590 156 L590 182" class="line"/>
  <path d="M590 262 L590 292" class="line"/>
  <path d="M590 372 L590 402" class="line"/>
  <path d="M590 448 L590 476" class="line"/>
  <path d="M590 556 L590 586" class="line"/>
  <path d="M590 666 L590 696" class="line"/>
  <path d="M590 776 L590 806" class="line"/>
  <path d="M590 886 L590 906" class="line"/>

  <!-- blocked/no-request loops -->
  <path d="M470 222 C400 222 400 133 500 133" class="soft"/>
  <text x="407" y="208" class="small">yes</text>
  <path d="M470 332 C385 332 385 133 500 133" class="soft"/>
  <text x="398" y="318" class="small">yes</text>
  <path d="M710 946 C770 946 770 425 680 425" class="soft"/>
  <text x="733" y="930" class="small">no request</text>

  <!-- grants to write/read columns -->
  <path d="M470 516 C380 516 350 633 280 633" class="line"/>
  <path d="M470 846 C380 846 350 633 280 633" class="line"/>
  <path d="M710 626 C790 626 820 593 900 593" class="line"/>
  <path d="M710 736 C790 736 820 593 900 593" class="line"/>
  <path d="M710 946 C820 946 840 593 900 593" class="line"/>

  <!-- write transaction -->
  <path d="M280 633 C405 633 430 425 500 425" class="line"/>
  <text x="292" y="606" class="small">burst done</text>

  <!-- read transaction -->
  <path d="M1000 616 L1000 650" class="line"/>
  <path d="M880 690 C770 690 740 425 680 425" class="soft"/>
  <text x="790" y="676" class="small">yes</text>
  <path d="M1000 730 L1000 765" class="line"/>
  <path d="M1000 811 L1000 840" class="line"/>
  <path d="M880 880 C770 880 740 425 680 425" class="line"/>
  <path d="M1120 880 C1145 880 1145 593 1100 593" class="soft"/>
  <text x="1128" y="862" class="small">continue</text>
</svg>
