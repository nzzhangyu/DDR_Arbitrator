<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="430" viewBox="0 0 1020 430">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .warn { fill: #fff7ed; stroke: #c2410c; }
      .name { font-size: 15px; font-weight: 700; }
      .note { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="40" y="42" class="title">refresh 与回退重传控制流</text>
  <rect x="370" y="80" width="240" height="72" class="box warn"/>
  <text x="490" y="108" text-anchor="middle" class="name">commok_check</text>
  <text x="490" y="130" text-anchor="middle" class="note">等待 comm_ok / 检测超时</text>

  <rect x="120" y="210" width="210" height="64" class="box"/>
  <text x="225" y="235" text-anchor="middle" class="name">refresh_process_en</text>
  <text x="225" y="256" text-anchor="middle" class="note">触发 refresh frame</text>
  <rect x="80" y="330" width="250" height="58" class="box"/>
  <text x="205" y="354" text-anchor="middle" class="name">aurora_tx_frame</text>
  <text x="205" y="375" text-anchor="middle" class="note">发送 refresh 固定控制字</text>

  <rect x="620" y="210" width="240" height="64" class="box"/>
  <text x="740" y="235" text-anchor="middle" class="name">rp_back_en / rst</text>
  <text x="740" y="256" text-anchor="middle" class="note">触发 DDR 读回退</text>
  <rect x="610" y="330" width="250" height="58" class="box"/>
  <text x="735" y="354" text-anchor="middle" class="name">rd_cache_ctrl</text>
  <text x="735" y="375" text-anchor="middle" class="note">计算 rp_back_view_addr</text>

  <rect x="370" y="330" width="190" height="58" class="box"/>
  <text x="465" y="354" text-anchor="middle" class="name">Aurora TX</text>
  <text x="465" y="375" text-anchor="middle" class="note">恢复/刷新通知</text>
  <rect x="875" y="330" width="95" height="58" class="box"/>
  <text x="922" y="354" text-anchor="middle" class="name">DDR</text>
  <text x="922" y="375" text-anchor="middle" class="note">地址回退</text>

  <path d="M430 152 L260 210" class="line"/>
  <path d="M225 274 L205 330" class="line"/>
  <path d="M330 359 L370 359" class="line"/>
  <path d="M550 152 L705 210" class="line"/>
  <path d="M740 274 L735 330" class="line"/>
  <path d="M860 359 L875 359" class="line"/>
</svg>
