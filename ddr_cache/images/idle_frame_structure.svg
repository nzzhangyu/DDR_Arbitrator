<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .row { font-size: 15px; font-weight: 700; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; }
      .sof { fill: #e0f2fe; }
      .cmd { fill: #ecfdf5; }
      .payload { fill: #fef9c3; }
      .tail { fill: #f1f5f9; }
      .crc { fill: #fae8ff; }
      .eof { fill: #fee2e2; }
      .name { font-size: 14px; font-weight: 700; }
      .note { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .cond { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <text x="40" y="42" class="title">idle frame 结构</text>
  <text x="40" y="76" class="note">SOF/EOF �?aurora_tx_frame 产生；command、payload、footer、CRC �?idle_frame_gen 通过 idle_data_out 提供�?/text>

  <text x="40" y="132" class="row">idle header frame</text>
  <rect x="190" y="100" width="80" height="70" class="box sof"/>
  <text x="230" y="96" text-anchor="middle" class="cond">SOF</text>
  <text x="230" y="129" text-anchor="middle" class="name">SOF</text>
  <text x="230" y="151" text-anchor="middle" class="note">帧开�?/text>

  <rect x="270" y="100" width="240" height="70" class="box cmd"/>
  <text x="390" y="96" text-anchor="middle" class="cond">header_cmd_2_en</text>
  <text x="390" y="124" text-anchor="middle" class="name">header command</text>
  <text x="390" y="148" text-anchor="middle" class="mono">04331000_00002100</text>

  <rect x="510" y="100" width="280" height="70" class="box payload"/>
  <text x="650" y="96" text-anchor="middle" class="cond">header_en</text>
  <text x="650" y="124" text-anchor="middle" class="name">header payload</text>
  <text x="650" y="148" text-anchor="middle" class="mono">idle_header_word(header_cnt)</text>

  <rect x="790" y="100" width="190" height="70" class="box tail"/>
  <text x="885" y="96" text-anchor="middle" class="cond">footer_en</text>
  <text x="885" y="124" text-anchor="middle" class="name">footer</text>
  <text x="885" y="148" text-anchor="middle" class="mono">FACEEACE_CACEBACE</text>

  <rect x="980" y="100" width="110" height="70" class="box crc"/>
  <text x="1035" y="96" text-anchor="middle" class="cond">crc_tx_2_en</text>
  <text x="1035" y="124" text-anchor="middle" class="name">CRC</text>
  <text x="1035" y="148" text-anchor="middle" class="mono">crc_out</text>

  <rect x="1090" y="100" width="80" height="70" class="box eof"/>
  <text x="1130" y="96" text-anchor="middle" class="cond">EOF</text>
  <text x="1130" y="129" text-anchor="middle" class="name">EOF</text>
  <text x="1130" y="151" text-anchor="middle" class="note">帧结�?/text>

  <text x="40" y="232" class="row">idle slice frame</text>
  <rect x="190" y="200" width="80" height="70" class="box sof"/>
  <text x="230" y="196" text-anchor="middle" class="cond">SOF</text>
  <text x="230" y="229" text-anchor="middle" class="name">SOF</text>
  <text x="230" y="251" text-anchor="middle" class="note">帧开�?/text>

  <rect x="270" y="200" width="240" height="70" class="box cmd"/>
  <text x="390" y="196" text-anchor="middle" class="cond">slice_cmd_2_en</text>
  <text x="390" y="224" text-anchor="middle" class="name">slice command</text>
  <text x="390" y="248" text-anchor="middle" class="mono">{04330, slice_cnt, 0000db00}</text>

  <rect x="510" y="200" width="280" height="70" class="box payload"/>
  <text x="650" y="196" text-anchor="middle" class="cond">idle_slice_data_en</text>
  <text x="650" y="224" text-anchor="middle" class="name">slice payload</text>
  <text x="650" y="248" text-anchor="middle" class="mono">{LFSR, LFSR, LFSR, LFSR}</text>

  <rect x="790" y="200" width="190" height="70" class="box tail"/>
  <text x="885" y="196" text-anchor="middle" class="cond">footer_en</text>
  <text x="885" y="224" text-anchor="middle" class="name">footer</text>
  <text x="885" y="248" text-anchor="middle" class="mono">FACEEACE_CACEBACE</text>

  <rect x="980" y="200" width="110" height="70" class="box crc"/>
  <text x="1035" y="196" text-anchor="middle" class="cond">crc_tx_2_en</text>
  <text x="1035" y="224" text-anchor="middle" class="name">CRC</text>
  <text x="1035" y="248" text-anchor="middle" class="mono">crc_out</text>

  <rect x="1090" y="200" width="80" height="70" class="box eof"/>
  <text x="1130" y="196" text-anchor="middle" class="cond">EOF</text>
  <text x="1130" y="229" text-anchor="middle" class="name">EOF</text>
  <text x="1130" y="251" text-anchor="middle" class="note">帧结�?/text>
</svg>
