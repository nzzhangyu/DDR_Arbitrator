  <path d="M690 147 C750 175, 840 182, 900 220" class="line"/>
  <path d="M340 112 C175 112, 38 178, 38 360 C38 360, 54 360, 70 360" class="line"/>

  <path d="M485 293 C470 312, 462 320, 462 330" class="line"/>
  <path d="M610 293 C650 314, 690 322, 710 330" class="line"/>
  <path d="M430 293 C365 360, 285 392, 245 440" class="line"/>
