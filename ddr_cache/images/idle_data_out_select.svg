<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="260" viewBox="0 0 1240 260">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f172a"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .note { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; }
      .crc { fill: #fae8ff; }
      .cmd { fill: #ecfdf5; }
      .payload { fill: #fef9c3; }
      .tail { fill: #f1f5f9; }
      .name { font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .cond { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .guide { stroke: #0f172a; stroke-width: 1.1; marker-end: url(#arrow); }
      .fallback { font-size: 12px; fill: #0f172a; font-weight: 700; }
    </style>
  </defs>

  <text x="40" y="42" class="title">idle_data_out 选择关系</text>
  <text x="40" y="76" class="note">从左到右表示代码中的选择优先级；条件标在进入对应块的边界处，块内为该条件下输出到 idle_data_out 的内容。</text>

  <rect x="40" y="120" width="150" height="80" class="box crc"/>
  <text x="72" y="104" text-anchor="middle" class="cond">crc_tx_2_en</text>
  <line x1="72" y1="108" x2="44" y2="120" class="guide"/>
  <text x="115" y="148" text-anchor="middle" class="name">CRC</text>
  <text x="115" y="174" text-anchor="middle" class="mono">crc_out</text>

  <rect x="190" y="120" width="210" height="80" class="box cmd"/>
  <text x="190" y="104" text-anchor="middle" class="cond">header_cmd_2_en</text>
  <line x1="190" y1="108" x2="190" y2="120" class="guide"/>
  <text x="295" y="148" text-anchor="middle" class="name">header command</text>
  <text x="295" y="174" text-anchor="middle" class="mono">H_FRAME_HEADER_DATA</text>

  <rect x="400" y="120" width="210" height="80" class="box cmd"/>
  <text x="400" y="104" text-anchor="middle" class="cond">slice_cmd_2_en</text>
  <line x1="400" y1="108" x2="400" y2="120" class="guide"/>
  <text x="505" y="148" text-anchor="middle" class="name">slice command</text>
  <text x="505" y="174" text-anchor="middle" class="mono">s_frame_header_data</text>

  <rect x="610" y="120" width="190" height="80" class="box payload"/>
  <text x="610" y="104" text-anchor="middle" class="cond">header_en</text>
  <line x1="610" y1="108" x2="610" y2="120" class="guide"/>
  <text x="705" y="148" text-anchor="middle" class="name">header payload</text>
  <text x="705" y="174" text-anchor="middle" class="mono">header_data</text>

  <rect x="800" y="120" width="170" height="80" class="box tail"/>
  <text x="800" y="104" text-anchor="middle" class="cond">footer_en</text>
  <line x1="800" y1="108" x2="800" y2="120" class="guide"/>
  <text x="885" y="148" text-anchor="middle" class="name">footer</text>
  <text x="885" y="174" text-anchor="middle" class="mono">FOOTER_DATA</text>

  <rect x="970" y="120" width="210" height="80" class="box payload"/>
  <text x="970" y="104" text-anchor="middle" class="cond">default</text>
  <line x1="970" y1="108" x2="970" y2="120" class="guide"/>
  <text x="1075" y="148" text-anchor="middle" class="name">slice payload</text>
  <text x="1075" y="174" text-anchor="middle" class="mono">idle_data_out_t</text>

  <text x="40" y="230" class="fallback">说明：default 路径对应没有 CRC、command、header payload、footer 控制信号命中时的 LFSR payload 输出。</text>
</svg>
