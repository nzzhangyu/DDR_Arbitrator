<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .mux { fill: #e0f2fe; stroke: #0369a1; }
      .name { font-size: 15px; font-weight: 700; }
      .note { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="40" y="42" class="title">tx_d_out 数据来源选择</text>

  <rect x="70" y="75" width="230" height="58" class="box"/>
  <text x="185" y="99" text-anchor="middle" class="name">normal frame</text>
  <text x="185" y="120" text-anchor="middle" class="note">aurora_frame_fifo_dout</text>

  <rect x="70" y="165" width="230" height="58" class="box"/>
  <text x="185" y="189" text-anchor="middle" class="name">idle frame</text>
  <text x="185" y="210" text-anchor="middle" class="note">idle_data_out</text>

  <rect x="70" y="255" width="230" height="58" class="box"/>
  <text x="185" y="279" text-anchor="middle" class="name">refresh frame</text>
  <text x="185" y="300" text-anchor="middle" class="note">固定 refresh 控制字</text>

  <rect x="455" y="150" width="230" height="88" class="box mux"/>
  <text x="570" y="183" text-anchor="middle" class="name">aurora_tx_frame</text>
  <text x="570" y="206" text-anchor="middle" class="note">根据 idle / refresh / FIFO 状态选择</text>

  <rect x="785" y="165" width="140" height="58" class="box"/>
  <text x="855" y="190" text-anchor="middle" class="name">Aurora TX</text>
  <text x="855" y="211" text-anchor="middle" class="note">tx_d_out</text>

  <path d="M300 104 C380 104,390 160,455 174" class="line"/>
  <path d="M300 194 L455 194" class="line"/>
  <path d="M300 284 C380 284,390 225,455 210" class="line"/>
  <path d="M685 194 L785 194" class="line"/>
</svg>
